<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker — Expenses & Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0d0f;
    --surface:  #16161a;
    --surface2: #1e1e24;
    --border:   #2a2a32;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --accent:   #7c6af7;
    --accent2:  #2dd4bf;
    --red:      #f06b6b;
    --cat1: #7c6af7; --cat2: #2dd4bf; --cat3: #f59e4a;
    --cat4: #f06b6b; --cat5: #a78bfa; --cat6: #34d399;
    --cat7: #fb923c; --cat8: #60a5fa;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  html { font-size: 15px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── LAYOUT ── */
  .app { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }

  header {
    padding: 32px 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  /* ── MODE TOGGLE ── */
  .toggle-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
    display: flex;
    position: relative;
  }
  .toggle-pill {
    position: absolute;
    top: 3px; left: 3px;
    height: calc(100% - 6px);
    width: calc(50% - 3px);
    background: var(--accent);
    border-radius: 4px;
    transition: transform .22s cubic-bezier(.4,0,.2,1), background .22s;
  }
  .toggle-wrap.habits .toggle-pill {
    transform: translateX(calc(100% + 0px));
    background: var(--accent2);
  }
  .toggle-btn {
    position: relative; z-index: 1;
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    font-family: var(--sans); font-size: .82rem; font-weight: 500;
    padding: 6px 18px;
    transition: color .15s;
    white-space: nowrap;
  }
  .toggle-btn.active { color: #fff; }

  /* ── SECTION HEADINGS ── */
  .section-label {
    font-family: var(--mono);
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* ── PANELS ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── EXPENSE FORM ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 2fr auto;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 16px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 28px;
    align-items: end;
  }
  @media(max-width:720px){
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .span2 { grid-column: 1/-1; }
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: .75rem; color: var(--muted); font-weight: 500; }

  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: .875rem;
    padding: 8px 10px;
    border-radius: 4px;
    outline: none;
    transition: border-color .15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: .875rem;
    font-weight: 500;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn.teal { background: var(--accent2); color: #0d0d0f; }
  .btn.ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    font-size: .75rem;
  }
  .btn.ghost:hover { border-color: var(--red); color: var(--red); }

  /* ── CHARTS ROW ── */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  @media(max-width:640px){ .charts-row { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
  }
  .chart-card canvas { max-height: 220px; }

  .chart-total {
    text-align: center;
    margin-top: 8px;
  }
  .chart-total .amount {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--accent);
  }
  .chart-total .sub { font-size: .75rem; color: var(--muted); }

  /* ── TRANSACTION LIST ── */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-row select { padding: 5px 8px; font-size: .78rem; width: auto; }

  .tx-list { display: flex; flex-direction: column; gap: 4px; }

  .tx-item {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    transition: border-color .15s;
  }
  .tx-item:hover { border-color: var(--border); background: var(--surface2); }

  .tx-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tx-info { min-width: 0; }
  .tx-note { font-size: .82rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: .72rem; color: var(--muted); margin-top: 1px; }
  .tx-amount {
    font-family: var(--mono);
    font-size: .9rem;
    font-weight: 500;
    color: var(--red);
    white-space: nowrap;
  }
  .tx-del { opacity: 0; transition: opacity .15s; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 2px 6px; }
  .tx-item:hover .tx-del { opacity: 1; }
  .tx-del:hover { color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: .875rem;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }

  /* ── HABITS PANEL ── */
  .habits-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 24px;
  }
  @media(max-width:680px){ .habits-layout { grid-template-columns: 1fr; } }

  .habit-sidebar { display: flex; flex-direction: column; gap: 14px; }

  .habit-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    border-radius: 0 6px 6px 0;
    padding: 14px;
  }
  .habit-form .field { margin-bottom: 10px; }
  .color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .color-swatch {
    width: 20px; height: 20px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: border-color .12s, transform .12s;
  }
  .color-swatch.sel { border-color: #fff; transform: scale(1.18); }

  .habit-list-sidebar { display: flex; flex-direction: column; gap: 6px; }
  .habit-pill {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    transition: border-color .12s;
  }
  .habit-pill.active-h { border-color: var(--accent2); }
  .habit-pill-left { display: flex; align-items: center; gap: 8px; font-size: .83rem; }
  .habit-pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .habit-pill-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .85rem; opacity: 0; transition: opacity .12s; }
  .habit-pill:hover .habit-pill-del { opacity: 1; }
  .habit-pill-del:hover { color: var(--red); }

  /* ── TODAY CHECKLIST ── */
  .today-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .today-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .today-date {
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--accent2);
  }
  .habit-check-list { display: flex; flex-direction: column; gap: 8px; }
  .habit-check-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color .12s;
    user-select: none;
  }
  .habit-check-item.done { border-color: var(--accent2); }
  .habit-checkbox {
    width: 18px; height: 18px;
    border-radius: 3px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .7rem;
    transition: background .12s, border-color .12s;
  }
  .habit-check-item.done .habit-checkbox {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #0d0d0f;
  }
  .habit-check-name { font-size: .875rem; }

  /* ── HEATMAP ── */
  .heatmap-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
  }
  .heatmap-wrap { display: flex; gap: 3px; }
  .heatmap-col { display: flex; flex-direction: column; gap: 3px; }
  .heatmap-cell {
    width: 11px; height: 11px;
    border-radius: 2px;
    background: var(--surface2);
    transition: transform .1s;
    cursor: default;
    position: relative;
  }
  .heatmap-cell:hover { transform: scale(1.3); z-index: 10; }
  .heatmap-month-labels {
    display: flex; gap: 3px;
    margin-bottom: 4px;
    margin-left: 0;
  }
  .heatmap-month-label {
    font-size: .62rem;
    color: var(--muted);
    font-family: var(--mono);
    width: 11px;
    overflow: visible;
    white-space: nowrap;
  }
  .heatmap-legend {
    display: flex; align-items: center; gap: 4px;
    margin-top: 10px;
    justify-content: flex-end;
  }
  .heatmap-legend-cell { width: 10px; height: 10px; border-radius: 2px; }
  .legend-label { font-size: .65rem; color: var(--muted); font-family: var(--mono); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 6px;
    font-size: .82rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">tr<span>.</span>acker</div>
    <div class="toggle-wrap" id="toggleWrap">
      <div class="toggle-pill"></div>
      <button class="toggle-btn active" onclick="switchMode('expenses')">Expenses</button>
      <button class="toggle-btn" onclick="switchMode('habits')">Habits</button>
    </div>
  </header>

  <!-- ════════════ EXPENSES PANEL ════════════ -->
  <div class="panel active" id="expensesPanel">
    <div class="section-label">Add Transaction</div>
    <div class="form-grid">
      <div class="field">
        <label>Category</label>
        <select id="expCat">
          <option>Food</option><option>Transport</option><option>Housing</option>
          <option>Health</option><option>Shopping</option><option>Entertainment</option>
          <option>Utilities</option><option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Amount</label>
        <input type="number" id="expAmount" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="expDate">
      </div>
      <div class="field span2">
        <label>Note</label>
        <input type="text" id="expNote" placeholder="What was this for?">
      </div>
      <div style="align-self:end">
        <button class="btn" onclick="addExpense()">Add</button>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="section-label">By Category</div>
        <canvas id="doughnutChart"></canvas>
        <div class="chart-total">
          <div class="amount" id="totalAmount">₹0</div>
          <div class="sub">total this month</div>
        </div>
      </div>
      <div class="chart-card">
        <div class="section-label">Monthly Spend</div>
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <div class="list-header">
      <div class="section-label" style="margin-bottom:0">Transactions</div>
      <div class="filter-row">
        <select id="filterCat" onchange="renderTransactions()">
          <option value="">All categories</option>
          <option>Food</option><option>Transport</option><option>Housing</option>
          <option>Health</option><option>Shopping</option><option>Entertainment</option>
          <option>Utilities</option><option>Other</option>
        </select>
        <select id="filterMonth" onchange="renderTransactions()">
          <option value="">All months</option>
        </select>
      </div>
    </div>
    <div class="tx-list" id="txList"></div>
  </div>

  <!-- ════════════ HABITS PANEL ════════════ -->
  <div class="panel" id="habitsPanel">
    <div class="habits-layout">
      <div class="habit-sidebar">
        <div class="habit-form">
          <div class="section-label">New Habit</div>
          <div class="field">
            <label>Name</label>
            <input type="text" id="habitName" placeholder="e.g. Morning run">
          </div>
          <div class="field">
            <label>Color</label>
            <div class="color-row" id="colorRow"></div>
          </div>
          <button class="btn teal" style="width:100%;margin-top:4px" onclick="addHabit()">Add Habit</button>
        </div>
        <div>
          <div class="section-label">Your Habits</div>
          <div class="habit-list-sidebar" id="habitListSidebar"></div>
        </div>
      </div>

      <div>
        <div class="today-card">
          <div class="today-header">
            <div class="section-label" style="margin-bottom:0">Today</div>
            <div class="today-date" id="todayDate"></div>
          </div>
          <div class="habit-check-list" id="habitCheckList"></div>
          <div id="noHabitsMsg" class="empty-state" style="display:none">Add a habit to start tracking →</div>
        </div>

        <div class="heatmap-card">
          <div class="section-label" id="heatmapTitle">Contribution Heatmap</div>
          <div id="heatmapWrap"></div>
          <div class="heatmap-legend">
            <span class="legend-label">less</span>
            <div class="heatmap-legend-cell" style="background:var(--surface2)"></div>
            <div class="heatmap-legend-cell" id="l1"></div>
            <div class="heatmap-legend-cell" id="l2"></div>
            <div class="heatmap-legend-cell" id="l3"></div>
            <div class="heatmap-legend-cell" id="l4"></div>
            <span class="legend-label">more</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────────────
const CATS = ['Food','Transport','Housing','Health','Shopping','Entertainment','Utilities','Other'];
const CAT_COLORS = ['#7c6af7','#2dd4bf','#f59e4a','#f06b6b','#a78bfa','#34d399','#fb923c','#60a5fa'];
const HABIT_COLORS = ['#2dd4bf','#7c6af7','#f59e4a','#f06b6b','#a78bfa','#34d399','#fb923c','#60a5fa','#f472b6','#38bdf8'];

let expenses = JSON.parse(localStorage.getItem('tr_expenses') || '[]');
let habits   = JSON.parse(localStorage.getItem('tr_habits')   || '[]');
let logs     = JSON.parse(localStorage.getItem('tr_logs')     || '{}'); // {habitId: {dateStr: bool}}
let selectedHabitId = null;
let selectedColor = HABIT_COLORS[0];
let doughnutChart, barChart;

// ─── UTILS ───────────────────────────────────────────────────
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate  = d => new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const fmtAmt   = a => '₹' + parseFloat(a).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid      = () => Math.random().toString(36).slice(2,9);
const save     = () => {
  localStorage.setItem('tr_expenses', JSON.stringify(expenses));
  localStorage.setItem('tr_habits',   JSON.stringify(habits));
  localStorage.setItem('tr_logs',     JSON.stringify(logs));
};

function toast(msg, color='var(--accent)'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = color;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ─── MODE SWITCH ─────────────────────────────────────────────
function switchMode(mode){
  document.getElementById('expensesPanel').classList.toggle('active', mode==='expenses');
  document.getElementById('habitsPanel').classList.toggle('active',  mode==='habits');
  document.getElementById('toggleWrap').classList.toggle('habits', mode==='habits');
  document.querySelectorAll('.toggle-btn').forEach((b,i)=>{
    b.classList.toggle('active',(mode==='expenses'&&i===0)||(mode==='habits'&&i===1));
  });
  if(mode==='habits') renderHabits();
}

// ─── EXPENSES ────────────────────────────────────────────────
function addExpense(){
  const cat    = document.getElementById('expCat').value;
  const amount = parseFloat(document.getElementById('expAmount').value);
  const date   = document.getElementById('expDate').value || todayStr();
  const note   = document.getElementById('expNote').value.trim() || cat;
  if(!amount || amount<=0){ toast('Enter a valid amount','var(--red)'); return; }
  expenses.unshift({id:uid(), cat, amount, date, note});
  save();
  document.getElementById('expAmount').value='';
  document.getElementById('expNote').value='';
  renderExpenses();
  toast('Transaction added ✓');
}

function deleteExpense(id){
  expenses = expenses.filter(e=>e.id!==id);
  save(); renderExpenses();
}

function renderExpenses(){
  populateMonthFilter();
  renderCharts();
  renderTransactions();
}

function populateMonthFilter(){
  const sel = document.getElementById('filterMonth');
  const cur = sel.value;
  const months = [...new Set(expenses.map(e=>e.date.slice(0,7)))].sort().reverse();
  sel.innerHTML = '<option value="">All months</option>' +
    months.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${fmtMonth(m)}</option>`).join('');
}

function fmtMonth(ym){
  const [y,m] = ym.split('-');
  return new Date(+y,+m-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'});
}

function renderTransactions(){
  const catF   = document.getElementById('filterCat').value;
  const monthF = document.getElementById('filterMonth').value;
  let list = expenses.filter(e=>
    (!catF || e.cat===catF) && (!monthF || e.date.startsWith(monthF))
  );
  const el = document.getElementById('txList');
  if(!list.length){
    el.innerHTML = '<div class="empty-state">No transactions yet — add one above.</div>'; return;
  }
  el.innerHTML = list.map(e=>{
    const ci = CATS.indexOf(e.cat);
    const col = ci>=0 ? CAT_COLORS[ci] : '#888';
    return `<div class="tx-item">
      <div class="tx-dot" style="background:${col}"></div>
      <div class="tx-info">
        <div class="tx-note">${e.note}</div>
        <div class="tx-meta">${e.cat} · ${fmtDate(e.date)}</div>
      </div>
      <div class="tx-amount">${fmtAmt(e.amount)}</div>
      <button class="tx-del" onclick="deleteExpense('${e.id}')" title="Delete">✕</button>
    </div>`;
  }).join('');
}

function renderCharts(){
  // ── Doughnut
  const thisMonth = todayStr().slice(0,7);
  const monthExp  = expenses.filter(e=>e.date.startsWith(thisMonth));
  const catTotals = CATS.map(c=>monthExp.filter(e=>e.cat===c).reduce((s,e)=>s+e.amount,0));
  const total     = catTotals.reduce((a,b)=>a+b,0);
  document.getElementById('totalAmount').textContent = fmtAmt(total);

  const dCtx = document.getElementById('doughnutChart').getContext('2d');
  if(doughnutChart) doughnutChart.destroy();
  doughnutChart = new Chart(dCtx,{
    type:'doughnut',
    data:{
      labels: CATS,
      datasets:[{
        data: catTotals,
        backgroundColor: CAT_COLORS,
        borderWidth: 0,
        hoverOffset: 6
      }]
    },
    options:{
      cutout:'68%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: ctx=>`  ${ctx.label}: ${fmtAmt(ctx.raw)}`
          },
          backgroundColor:'#1e1e24',
          borderColor:'#2a2a32',
          borderWidth:1,
          titleColor:'#e8e8f0',
          bodyColor:'#9999b0',
          padding:10
        }
      }
    }
  });

  // ── Bar — last 6 months
  const months6 = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months6.push(d.toISOString().slice(0,7));
  }
  const barData = months6.map(m=>expenses.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+e.amount,0));
  const barLabels = months6.map(m=>fmtMonth(m));

  const bCtx = document.getElementById('barChart').getContext('2d');
  if(barChart) barChart.destroy();
  barChart = new Chart(bCtx,{
    type:'bar',
    data:{
      labels: barLabels,
      datasets:[{
        data: barData,
        backgroundColor: months6.map((m,i)=>i===5?'#7c6af7':'#2a2a3a'),
        hoverBackgroundColor: '#9d90f9',
        borderRadius: 4,
        borderSkipped: false
      }]
    },
    options:{
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#1e1e24', borderColor:'#2a2a32', borderWidth:1,
        titleColor:'#e8e8f0', bodyColor:'#9999b0', padding:10,
        callbacks:{ label: ctx=>`  ${fmtAmt(ctx.raw)}` }
      }},
      scales:{
        x:{ grid:{color:'#1e1e24'}, ticks:{color:'#6b6b80',font:{family:"'JetBrains Mono'",size:10}} },
        y:{ grid:{color:'#1e1e24'}, ticks:{color:'#6b6b80',font:{family:"'JetBrains Mono'",size:10},
          callback: v=>'₹'+v.toLocaleString('en-IN')
        }}
      }
    }
  });
}

// ─── HABITS ──────────────────────────────────────────────────
function initColorPicker(){
  const row = document.getElementById('colorRow');
  row.innerHTML = HABIT_COLORS.map(c=>
    `<div class="color-swatch ${c===selectedColor?'sel':''}" style="background:${c}" data-color="${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
}

function pickColor(c){
  selectedColor = c;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('sel',s.dataset.color===c));
}

function addHabit(){
  const name = document.getElementById('habitName').value.trim();
  if(!name){ toast('Enter a habit name','var(--red)'); return; }
  habits.push({id:uid(), name, color:selectedColor});
  save();
  document.getElementById('habitName').value='';
  renderHabits();
  toast('Habit added ✓','var(--accent2)');
}

function deleteHabit(id){
  habits = habits.filter(h=>h.id!==id);
  delete logs[id];
  if(selectedHabitId===id) selectedHabitId = habits[0]?.id || null;
  save(); renderHabits();
}

function toggleLog(habitId, date){
  if(!logs[habitId]) logs[habitId] = {};
  logs[habitId][date] = !logs[habitId][date];
  save(); renderHabits();
}

function renderHabits(){
  const today = todayStr();
  document.getElementById('todayDate').textContent = fmtDate(today);

  // Sidebar habit list
  const sidebar = document.getElementById('habitListSidebar');
  if(!habits.length){
    sidebar.innerHTML = '<div style="font-size:.78rem;color:var(--muted);padding:8px 0">No habits yet</div>';
  } else {
    sidebar.innerHTML = habits.map(h=>
      `<div class="habit-pill ${h.id===selectedHabitId?'active-h':''}" onclick="selectHabit('${h.id}')">
        <div class="habit-pill-left">
          <div class="habit-pill-dot" style="background:${h.color}"></div>
          <span>${h.name}</span>
        </div>
        <button class="habit-pill-del" onclick="event.stopPropagation();deleteHabit('${h.id}')" title="Delete">✕</button>
      </div>`
    ).join('');
  }

  // Today checklist
  const cl = document.getElementById('habitCheckList');
  const nm = document.getElementById('noHabitsMsg');
  if(!habits.length){
    cl.innerHTML=''; nm.style.display='block';
  } else {
    nm.style.display='none';
    cl.innerHTML = habits.map(h=>{
      const done = logs[h.id]?.[today];
      return `<div class="habit-check-item ${done?'done':''}" onclick="toggleLog('${h.id}','${today}')">
        <div class="habit-checkbox" style="${done?'background:'+h.color+';border-color:'+h.color+';color:#0d0d0f':'border-color:'+h.color+'44'}">${done?'✓':''}</div>
        <span class="habit-check-name">${h.name}</span>
      </div>`;
    }).join('');
  }

  // Heatmap
  if(!selectedHabitId && habits.length) selectedHabitId = habits[0].id;
  renderHeatmap();
}

function selectHabit(id){
  selectedHabitId = id;
  renderHabits();
}

function renderHeatmap(){
  const wrap = document.getElementById('heatmapWrap');
  const habit = habits.find(h=>h.id===selectedHabitId);
  if(!habit){ wrap.innerHTML='<div class="empty-state">Select a habit to see heatmap</div>'; return; }

  document.getElementById('heatmapTitle').textContent = habit.name + ' — Heatmap';
  const col = habit.color;
  // Shade levels
  const shades = [
    hexAlpha(col, 0.12),
    hexAlpha(col, 0.35),
    hexAlpha(col, 0.6),
    hexAlpha(col, 0.82),
    col
  ];
  // Update legend
  ['l1','l2','l3','l4'].forEach((id,i)=>document.getElementById(id).style.background=shades[i+1]);

  const habitLog = logs[selectedHabitId] || {};
  // Build 52 weeks back from today
  const end = new Date();
  const start = new Date(end);
  start.setDate(end.getDate() - 364);
  // Align to Sunday
  start.setDate(start.getDate() - start.getDay());

  const weeks = [];
  let cur = new Date(start);
  while(cur <= end){
    const week = [];
    for(let d=0;d<7;d++){
      week.push(new Date(cur));
      cur.setDate(cur.getDate()+1);
    }
    weeks.push(week);
  }

  // Month labels — find first week of each month
  const monthLabels = new Array(weeks.length).fill('');
  let lastMonth = -1;
  weeks.forEach((week,wi)=>{
    const m = week[0].getMonth();
    if(m!==lastMonth){ monthLabels[wi]=week[0].toLocaleDateString('en',{month:'short'}); lastMonth=m; }
  });

  const endDate = todayStr();
  let html = `<div class="heatmap-month-labels">${monthLabels.map(l=>`<div class="heatmap-month-label">${l}</div>`).join('')}</div>`;
  html += '<div class="heatmap-wrap">';
  weeks.forEach(week=>{
    html += '<div class="heatmap-col">';
    week.forEach(day=>{
      const ds = day.toISOString().slice(0,10);
      const future = ds > endDate;
      const done = habitLog[ds];
      const bg = future ? 'transparent' : (done ? col : shades[0]);
      const opacity = future ? '0' : '1';
      html += `<div class="heatmap-cell" style="background:${bg};opacity:${opacity}" title="${ds}${done?' ✓':''}"></div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function hexAlpha(hex, alpha){
  // Convert hex to rgba
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ─── INIT ────────────────────────────────────────────────────
document.getElementById('expDate').value = todayStr();
initColorPicker();
renderExpenses();
renderHabits();
</script>
